[project]
name = "warera-mcp"
version = "1.0.0"
description = "Standalone, semantic, strictly read-only MCP server for WarEra game data."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "WarEra MCP contributors" }]
keywords = ["mcp", "warera", "model-context-protocol", "read-only"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Games/Entertainment",
    "Topic :: Internet",
]
dependencies = [
    "httpx>=0.27,<1.0",
    "mcp>=1.9,<2.0",
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.3,<3.0",
    "starlette>=0.37,<2.0",
    "typing-extensions>=4.12",
    "uvicorn>=0.30,<1.0",
]

[project.scripts]
warera-mcp = "warera_mcp.__main__:main"

[project.urls]
Documentation = "https://github.com/LorissDaniel/warera-mcp#readme"
Repository = "https://github.com/LorissDaniel/warera-mcp"
Issues = "https://github.com/LorissDaniel/warera-mcp/issues"

[project.optional-dependencies]
otel = [
    "opentelemetry-api>=1.25",
    "opentelemetry-sdk>=1.25",
]

[dependency-groups]
dev = [
    "coverage[toml]>=7.5",
    "mypy>=1.10",
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/warera_mcp"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "SIM",    # flake8-simplify
    "TID",    # flake8-tidy-imports
    "RUF",    # ruff-specific
    "ASYNC",  # flake8-async
    "S",      # flake8-bandit (security)
]
ignore = [
    "S101",   # asserts are fine in tests; runtime code does not use them for control flow
    "B008",   # FastAPI/FastMCP-style default factories are intentional
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S311"]

[tool.ruff.lint.isort]
known-first-party = ["warera_mcp"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
warn_unused_ignores = true
show_error_codes = true
files = ["src/warera_mcp"]

[[tool.mypy.overrides]]
module = ["mcp.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers --strict-config"
filterwarnings = ["error"]
markers = [
    "live: opt-in tests that call the real WarEra API (never run in CI by default)",
]

[tool.coverage.run]
branch = true
source = ["src/warera_mcp"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
